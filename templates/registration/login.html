{% extends "base.html" %}

{% block title %}Dang nhap{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
    <div class="hero-panel fade-in">
        <div class="mb-6">
            <span class="badge-soft mb-3">Secure Access</span>
            <h1 class="mb-2">Dang nhap</h1>
            <p class="section-subtitle">Truy cap he thong dieu hanh phong kham voi giao dien moi.</p>
        </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="space-y-4">
                        {{ form.as_p }}
                    </div>
                    <button class="btn-primary mt-5 w-full" type="submit"><i data-lucide="log-in" class="icon-sm"></i>Dang nhap</button>
                </form>
    </div>
</div>
{% endblock %}
