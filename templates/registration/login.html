{% extends "base.html" %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
    <div class="hero-panel fade-in">
        <div class="mb-6">
            <span class="badge-soft mb-3">Đăng nhập hệ thống</span>
            <h1 class="mb-2">Đăng nhập</h1>
            <p class="section-subtitle">Bệnh nhân đăng nhập bằng số điện thoại. Quản trị viên, lễ tân và bác sĩ đăng nhập bằng username.</p>
        </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="space-y-4">
                        {{ form.as_p }}
                    </div>
                    <button class="btn-primary mt-5 w-full" type="submit"><i data-lucide="log-in" class="icon-sm"></i>Đăng nhập</button>
                </form>
    </div>
</div>
{% endblock %}
