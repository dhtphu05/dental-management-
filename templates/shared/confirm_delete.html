{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl">
    <div class="surface-card-danger fade-in">
        <h1 class="mb-3">"{{ page_title }}"</h1>
        <p class="section-subtitle mb-6">Hành động này sẽ xóa dữ liệu khỏi hệ thống. Hãy xác nhận trước khi tiếp tục.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="flex flex-wrap gap-3">
                        <button class="btn-danger" type="submit"><i data-lucide="trash-2" class="icon-sm"></i>Xóa</button>
                        <a class="btn-secondary" href="javascript:history.back()"><i data-lucide="arrow-left" class="icon-sm"></i>Hủy</a>
                    </div>
                </form>
    </div>
</div>
{% endblock %}
